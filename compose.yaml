services:
  postgres:
    image: postgres:17-alpine
    container_name: gps-distance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gps_db}
      POSTGRES_USER: ${DB_USERNAME:-gps_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gps_password}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gps_user} -d ${DB_NAME:-gps_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

