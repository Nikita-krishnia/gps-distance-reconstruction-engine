spring.application.name=gps-distance-engine
server.port=8081

# PostgreSQL DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gps_db}
spring.datasource.username=${DB_USERNAME:gps_user}
spring.datasource.password=${DB_PASSWORD:gps_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# GPS Data Cleaning Defaults
gps.cleaning.accuracy-threshold-meters=50
gps.cleaning.max-speed-kmh=120

# Milestone Anchor Defaults
gps.anchors.office-radius-meters=400
gps.anchors.include-no-show=false

# Segment Distance Reconstruction Defaults
gps.distance.short-gap-seconds=70
gps.distance.parked-speed-kmh=5
gps.distance.max-route-meters=100000
gps.distance.fallback-multiplier=1.4

# Routing Provider Defaults
routing.provider=fake
routing.fake.detour-factor=1.3
routing.osrm.base-url=${OSRM_BASE_URL:http://localhost:5000}
routing.osrm.api-key=${OSRM_API_KEY:}
routing.osrm.connect-timeout-millis=2000
routing.osrm.request-timeout-millis=3000

# Routing Cache Defaults
routing.cache.enabled=true
routing.cache.max-entries=100000
routing.cache.ttl-hours=24
routing.cache.cell-size-degrees=0.001
routing.cache.provider-version=v1

# Routing Circuit Breaker Defaults
routing.breaker.failure-threshold=5
routing.breaker.open-seconds=30

# Degraded Trip Recompute Job Defaults
recompute.enabled=true
recompute.interval-seconds=30
recompute.batch-size=50



